<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🍴 RecipeHub</div>
        <nav>
            <button id = "random-btn">🎲 Випадковий рецепт</button>
            <button id = "what-cook-btn">🤔 Що приготувати?</button>
            <button id = "favorites-btn">❤️ Обране</button>
            <button id = "theme-btn">🌙</button>
        </nav>
    </header>
    
    <main>
        <section class = "hero">
            <h1>Знайди свій рецепт</h1>
            <p>Шукай страви, знаходь нові смаки та готуй щось круте.</p>
            <div class = "search-box">
                <input
                    type ="text"
                    id = "search-input"
                    placeholder="Наприклад:pizza, chicken..."
                >
                <button id = "search-btn">🔍 Знайти</button>
            </div>
        </section>

        <section class = "categories">
            <h2>Категорії</h2>
            <div class = "category-buttons">
                <button data-category="Chicken">🍗 Курка</button>
                <button data-category="Beef">🥩 Яловичина</button>
                <button data-category="Pasta">🍝 Паста</button>
                <button data-category="Dessert">🍰 Десерти</button>
                <button data-category="Seafood">🐟 Морепродукти</button>
                <button data-category="Breakfast">🍳 Сніданок</button>             
            </div>
        </section>

        <section>
            <h2 id="results-title">Популярні рецепти</h2>
            <div id="recipes-container" class="recipes-container"></div>
        </section>
    </main>

    <div id="recipe-modal" class = "modal hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">✕</button>
            <button id="favorite-btn" class="favorite-btn">
                🤍 Додати в обране
            </button>           
            <img id="modal-image" src="" alt="" class="modal-image">
            <h2 id = "modal-title"></h2>
            <p id = "modal-info"></p>
            <h3>Інгредієнти</h3>
            <ul id = "ingredients-list"></ul>
            <h3>Приготування</h3>
            <p id = "instructions"></p>
        </div>
    </div>
    <div id="image-modal" class="image-modal hidden">
    <button id="close-image" class="close-image">✕</button>
    <img id="big-image" src="" alt="">
</div>
    <div id="cook-modal" class="modal hidden">
    <div class="cook-content">
        <button id="close-cook-modal" class="close-btn">✕</button>

        <h2>🤔 Що приготувати?</h2>

        <p>
            Напиши продукти, які є у тебе вдома.
        </p>

        <input
            id="ingredients-input"
            type="text"
            placeholder="Наприклад: chicken, rice, tomato"
        >

        <button id="find-cook-btn">
            🔍 Знайти рецепти
        </button>

        <p id="cook-status"></p>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
